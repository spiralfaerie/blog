<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap');

  :root{
    --bg:        #0c0a12;
    --card:      #15111e;
    --card-hi:   #1c1628;
    --rose:      #d1717c;
    --lavender:  #9a80e0;
    --sage:      #45a68d;
    --gold:      #dba63e;
    --ink:       #e6dfda;
    --ink-dim:   #8a7f96;
    --hairline:  #241c33;
  }

  *{ box-sizing:border-box; }

  html{ scroll-behavior:smooth; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    position:relative;
    overflow-x:hidden;
  }

  /* ---------- grain overlay ---------- */
  .grain{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.07;
    mix-blend-mode:overlay;
  }

  /* ---------- flat paper-toned background ---------- */
  .wash{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
    background:var(--bg);
  }

  /* ---------- home / spiral button ---------- */
  .spiral-home{
    position:absolute;
    top:26px;
    right:30px;
    z-index:6;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    border:none;
    background:none;
    padding:0;
  }
  .spiral-home svg{
    width:100%;
    height:100%;
    animation:spin 14s linear infinite;
    filter:drop-shadow(0 0 5px rgba(204,109,120,0.4));
    transition:filter 0.4s ease;
  }
  .spiral-home:hover svg{
    filter:drop-shadow(0 0 10px rgba(204,109,120,0.65));
  }
  @keyframes spin{
    from{ transform:rotate(0deg); }
    to{ transform:rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .spiral-home svg{ animation:none; }
  }

  /* ---------- layout ---------- */
  header.top{
    position:relative;
    z-index:5;
    height:110px;
  }

  main{
    position:relative;
    z-index:5;
    max-width:1180px;
    margin:0 auto;
    padding:0 28px 120px;
  }

  .feed{
    column-count:3;
    column-gap:22px;
  }
  @media (max-width:980px){ .feed{ column-count:2; } }
  @media (max-width:620px){ .feed{ column-count:1; } }

  .card{
    break-inside:avoid;
    margin-bottom:22px;
    border-radius:3px;
    overflow:hidden;
    border:1px solid var(--hairline);
    background:var(--card);
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.7s ease forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }

  .card.text,
  .card.grouped{
    transition:border-color 0.3s ease, background 0.3s ease;
  }
  .card.text:hover,
  .card.grouped:hover{
    border-color:var(--rose);
    background:var(--card-hi);
  }

  .grouped-images{
    display:grid;
    gap:2px;
    line-height:0;
  }
  .img-tile{ position:relative; line-height:0; }
  .img-tile img,
  .img-tile .ph{ width:100%; height:100%; object-fit:cover; display:block; }

  .entry-body{
    padding:18px 24px 22px;
  }

  .entry-date{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.09em;
    text-transform:uppercase;
    color:var(--gold);
    display:block;
    margin-bottom:8px;
  }
  .entry-time{
    font-family:'Space Mono', monospace;
    font-size:9px;
    letter-spacing:0.05em;
    color:var(--ink-dim);
    opacity:0.75;
    margin-left:7px;
    text-transform:lowercase;
  }

  .entry-title{
    font-family:'Cormorant Garamond', serif;
    font-style:normal;
    font-weight:600;
    font-size:25px;
    letter-spacing:0.01em;
    color:var(--ink);
    margin:0 0 12px;
    line-height:1.25;
  }

  .entry-text{
    font-size:14px;
    line-height:1.65;
    color:var(--ink-dim);
    margin:0;
    white-space:pre-wrap;
  }

  .ph{
    aspect-ratio: var(--ar, 4/5);
    background:
      linear-gradient(160deg, var(--c1), var(--c2));
    position:relative;
  }
  .ph::after{
    content:attr(data-label);
    position:absolute;
    left:12px;
    bottom:12px;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.06em;
    color:rgba(233,227,218,0.55);
    text-transform:uppercase;
  }

  footer{
    position:relative;
    z-index:5;
    text-align:center;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-dim);
    padding:40px 0 60px;
    text-transform:uppercase;
    opacity:0.6;
  }

  /* ---------- owner-only edit system ---------- */
  .owner-toggle{
    position:fixed;
    bottom:22px;
    right:22px;
    z-index:70;
    width:34px;
    height:34px;
    border-radius:50%;
    border:1px solid var(--hairline);
    background:var(--card-hi);
    color:var(--ink-dim);
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:0.5;
    transition:opacity 0.25s ease, border-color 0.25s ease, color 0.25s ease;
  }
  .owner-toggle:hover{ opacity:1; border-color:var(--rose); color:var(--rose); }
  .owner-toggle.unlocked{ opacity:1; border-color:var(--sage); color:var(--sage); }

  .modal-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(8,6,12,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .modal{
    background:var(--card-hi);
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:26px;
    width:100%;
    max-width:340px;
  }
  .modal h3{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    margin:0 0 6px;
    color:var(--ink);
  }
  .modal p.note{
    font-size:12px;
    color:var(--ink-dim);
    line-height:1.5;
    margin:0 0 14px;
  }
  .modal input{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:13px;
    background:var(--bg);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:9px 10px;
    color:var(--ink);
    margin-bottom:10px;
  }
  .modal .row{ display:flex; gap:8px; justify-content:flex-end; }
  .modal button{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    border:1px solid var(--hairline);
    background:none;
    color:var(--ink);
    padding:9px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:border-color 0.2s ease, color 0.2s ease;
  }
  .modal button.primary{ border-color:var(--sage); color:var(--sage); }
  .modal button:hover{ border-color:var(--rose); color:var(--rose); }
  .modal .err{ color:var(--rose); font-size:12px; min-height:14px; margin:-4px 0 8px; }

  .edit-panel{
    position:fixed;
    bottom:70px;
    right:22px;
    z-index:70;
    width:270px;
    max-height:65vh;
    overflow-y:auto;
    background:var(--card-hi);
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:16px;
    display:none;
  }
  .edit-panel.open{ display:block; }
  .edit-panel h4{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:0 0 10px;
  }
  .edit-panel input, .edit-panel textarea{
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:12px;
    background:var(--bg);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:7px 8px;
    color:var(--ink);
    margin-bottom:7px;
  }
  .edit-panel textarea{ min-height:56px; resize:vertical; }
  .edit-panel .file-label{
    display:block;
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:5px;
  }
  .edit-panel input[type="file"],
  .modal input[type="file"]{
    width:100%;
    font-size:11px;
    color:var(--ink-dim);
    margin-bottom:10px;
  }
  .color-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .color-row input[type="color"]{
    width:34px;
    height:28px;
    padding:0;
    border:1px solid var(--hairline);
    border-radius:3px;
    background:none;
    cursor:pointer;
  }
  .color-row span{
    font-family:'Space Mono', monospace;
    font-size:11px;
    color:var(--ink-dim);
  }
  .color-row button{
    margin-left:auto;
    font-family:'Space Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    background:none;
    border:none;
    color:var(--ink-dim);
    cursor:pointer;
    text-decoration:underline;
  }
  .color-row button:hover{ color:var(--rose); }
  .edit-panel button.add-btn,
  .edit-panel button.export-btn,
  .edit-panel button.reset-btn{
    width:100%;
    font-family:'Space Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    background:none;
    border:1px dashed var(--hairline);
    border-radius:3px;
    padding:8px;
    color:var(--ink-dim);
    cursor:pointer;
    margin-bottom:8px;
  }
  .edit-panel button.add-btn:hover{ border-color:var(--sage); color:var(--sage); }
  .edit-panel button.export-btn{ border-style:solid; }
  .edit-panel button.export-btn:hover{ border-color:var(--gold); color:var(--gold); }
  .edit-panel button.reset-btn:hover{ border-color:var(--rose); color:var(--rose); }
  .edit-panel .hint{
    font-size:11px;
    line-height:1.5;
    color:var(--ink-dim);
    margin:0 0 12px;
  }

  .card-controls{
    display:none;
    gap:10px;
    padding:8px 24px 14px;
    border-top:1px solid var(--hairline);
    margin-top:2px;
    flex-wrap:wrap;
  }
  body.owner-mode .card.text .card-controls,
  body.owner-mode .card.grouped .card-controls{ display:flex; }
  .card-controls button{
    font-family:'Space Mono', monospace;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.04em;
    background:none;
    border:none;
    color:var(--ink-dim);
    cursor:pointer;
    padding:0;
  }
  .card-controls button:hover{ color:var(--rose); }

  body.owner-mode .entry-title,
  body.owner-mode .entry-text{
    outline:1px dashed transparent;
    border-radius:2px;
    transition:outline-color 0.2s ease;
    cursor:text;
  }
  body.owner-mode .entry-title:hover,
  body.owner-mode .entry-text:hover{ outline-color:var(--hairline); }
  body.owner-mode .entry-title:focus,
  body.owner-mode .entry-text:focus{ outline-color:var(--sage); }
  body.owner-mode .entry-title:empty::before,
  body.owner-mode .entry-text:empty::before{
    content:attr(data-placeholder);
    color:var(--ink-dim);
    opacity:0.55;
    font-style:normal;
  }
  body.owner-mode .entry-title:empty,
  body.owner-mode .entry-text:empty{
    display:block;
    min-height:1.3em;
  }

  .panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .panel-head h4{ margin:0; }
  .panel-arrow{
    display:flex;
    align-items:center;
    justify-content:center;
    width:22px; height:22px;
    border-radius:50%;
    background:none;
    border:none;
    color:var(--ink-dim);
    cursor:pointer;
    transition:color 0.2s ease;
  }
  .panel-arrow:hover{ color:var(--rose); }
  .pending-warning{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    line-height:1.5;
    color:var(--rose);
    background:rgba(209,113,124,0.1);
    border:1px solid rgba(209,113,124,0.35);
    border-radius:3px;
    padding:8px 10px;
    margin-bottom:10px;
  }

  /* stylized close/remove buttons, matching the spiral's linework */
  .x-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(3,2,6,0.55);
    border:none;
    color:var(--rose);
    cursor:pointer;
    padding:0;
    transition:color 0.25s ease, filter 0.25s ease;
  }
  .x-btn:hover{
    color:var(--gold);
    filter:drop-shadow(0 0 5px rgba(209,113,124,0.55));
  }

  .img-del{
    position:absolute; top:8px; right:8px;
    width:24px; height:24px;
    display:none;
  }
  body.owner-mode .img-tile:hover .img-del{ display:flex; }

  /* ---------- video tiles ---------- */
  .video-tile{ cursor:pointer; }
  .tile-video{ width:100%; height:100%; object-fit:cover; display:block; }

  /* ---------- pending media (new-entry staging) ---------- */
  .pending-media{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:8px;
  }
  .pending-thumb{
    position:relative;
    width:46px; height:46px;
    border-radius:3px;
    overflow:hidden;
    border:1px solid var(--hairline);
    line-height:0;
  }
  .pending-thumb img,
  .pending-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .pending-thumb .x-btn{
    position:absolute; top:2px; right:2px;
    width:16px; height:16px;
    background:rgba(3,2,6,0.7);
  }

  .pending-audio{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--ink-dim);
    background:rgba(255,255,255,0.03);
    border:1px solid var(--hairline);
    border-radius:3px;
    padding:6px 8px;
    margin-bottom:8px;
  }
  .pending-audio span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pending-audio .x-btn{ width:16px; height:16px; flex-shrink:0; }

  .theme-grid{
    display:flex;
    flex-direction:column;
    gap:5px;
    margin-bottom:8px;
  }
  .theme-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .theme-row span{
    font-family:'Space Mono', monospace;
    font-size:10.5px;
    color:var(--ink-dim);
  }
  .theme-row input[type="color"]{
    width:28px; height:22px;
    padding:0;
    border:1px solid var(--hairline);
    border-radius:3px;
    background:none;
    cursor:pointer;
  }

  .audio-volume{
    position:absolute;
    left:14px; top:14px;
    z-index:2;
    display:flex;
    align-items:center;
    gap:7px;
    background:rgba(3,2,6,0.55);
    border-radius:20px;
    padding:6px 12px 6px 8px;
  }
  .audio-volume .vol-icon{ color:var(--rose); display:flex; flex-shrink:0; }
  .audio-volume input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:70px;
    height:3px;
    background:rgba(255,255,255,0.25);
    border-radius:2px;
    outline:none;
  }
  .audio-volume input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:11px; height:11px;
    border-radius:50%;
    background:var(--rose);
    cursor:pointer;
  }
  .audio-volume input[type="range"]::-moz-range-thumb{
    width:11px; height:11px;
    border:none;
    border-radius:50%;
    background:var(--rose);
    cursor:pointer;
  }

  /* ---------- click-to-expand ---------- */
  body:not(.owner-mode) .card{ cursor:pointer; }

  .expand-overlay{
    position:fixed;
    inset:0;
    z-index:90;
    background:rgba(3,2,6,0.88);
    display:none;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
    opacity:0;
    transition:opacity 0.3s ease;
  }
  .expand-overlay.open{ display:flex; opacity:1; }

  .expand-card{
    position:relative;
    max-width:640px;
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    background:var(--card-hi);
    border:1px solid var(--hairline);
    border-radius:5px;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  .expand-card::-webkit-scrollbar{ display:none; }

  .expand-close{
    position:absolute;
    top:14px; right:14px;
    z-index:2;
    width:32px; height:32px;
  }

  .expand-images{ gap:2px; }
  .expand-images .img-tile{
    overflow:hidden;
  }
  .expand-images .img-tile img,
  .expand-images .img-tile video,
  .expand-images .img-tile .ph{
    width:100%;
    height:65vh;
    object-fit:cover;
    display:block;
  }
  .expand-body{ padding:26px 30px 30px; }
  .expand-body .entry-title{ font-size:32px; margin-bottom:16px; }
  .expand-body .entry-text{ font-size:15.5px; line-height:1.75; color:var(--ink); }
</style>
</head>
<body>

<div class="wash"></div>
<svg class="grain" xmlns="http://www.w3.org/2000/svg">
  <filter id="noise">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" result="noise"/>
    <feColorMatrix in="noise" type="matrix"
      values="0 0 0 0 0.62  0 0 0 0 0.52  0 0 0 0 0.78  0 0 0 0.7 0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>

<header class="top">
  <button class="spiral-home" id="homeBtn" aria-label="Home" title="Home">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path id="spiralPath" fill="none" stroke="var(--rose)" stroke-width="2.1"
            stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main>
  <div class="feed" id="feed"></div>
</main>

<footer>est. mmxxvi</footer>

<button class="owner-toggle" id="ownerToggle" title="Owner edit mode">✎</button>

<div class="edit-panel" id="editPanel">
  <div class="panel-head">
    <h4>new entry</h4>
    <button class="panel-arrow" id="panelArrow" title="tuck away">
      <svg width="14" height="14" viewBox="0 0 24 24"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="pending-warning" id="pendingWarning" style="display:none;"></div>
  <input type="text" id="newTitle" placeholder="title (optional)">
  <textarea id="newText" placeholder="text (optional)"></textarea>
  <label class="file-label">photos & videos (optional)</label>
  <div class="pending-media" id="pendingMedia"></div>
  <button type="button" class="add-btn" id="addMediaBtn">+ add photos / videos</button>
  <input type="file" id="mediaPicker" accept="image/*,video/*" multiple style="display:none;">
  <label class="file-label">background audio (optional)</label>
  <div class="pending-audio" id="pendingAudioBox" style="display:none;"></div>
  <button type="button" class="add-btn" id="addAudioBtn">+ add audio</button>
  <input type="file" id="audioPicker" accept="audio/*" style="display:none;">
  <label class="file-label">card color (optional)</label>
  <div class="color-row">
    <input type="color" id="newColor" value="#15111e">
    <span id="colorHex">#15111e</span>
    <button type="button" id="colorReset" title="reset to default">reset</button>
  </div>
  <button class="add-btn" id="addEntryBtn">+ publish entry</button>

  <label class="file-label" style="margin-top:6px;">site theme</label>
  <div class="theme-grid" id="themeGrid"></div>
  <button class="reset-btn" id="themeResetBtn">reset theme to default</button>

  <div class="hint" id="publishHint">connect a GitHub repo once, then hit "publish live" to push changes straight to your site — no copying, no re-uploading.</div>
  <button class="export-btn" id="publishLiveBtn">publish live</button>
  <button class="reset-btn" id="ghSettingsBtn">github settings</button>
  <button class="reset-btn" id="resetBtn">reset local drafts</button>
  <button class="reset-btn" id="lockBtn">exit edit mode</button>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none;">
  <div class="modal" id="modalBox"></div>
</div>

<div class="expand-overlay" id="expandOverlay" onclick="if(event.target===this) closeExpand()"></div>

<script>
/* ============================================================
   DEFAULT POSTS
   This is the array that ships live to every visitor — updated by
   the "publish live" button in the edit panel (signed in via GitHub).
   Keep the START/END markers intact — publish uses them to find and
   replace this block.
============================================================ */
/* DEFAULT_POSTS_START */
const defaultPosts = [
  {

    "images": [
      {
        "type": "image",
        "path": "media/1786083113851-12-years-ago.png"
      }
    ],
    "audio": null,
    "color": "#2e251b"

/* ============================================================
   WHY IT WORKS THIS WAY
   This is a static file with no server, so there's no database
   that visitors' browsers share. Anything typed into the edit
   panel is saved to *your own browser's* local storage only —
   it never touches anyone else's copy of the page, edited or not.
   The passcode lock isn't bank-grade security; it's there so a
   passerby on your laptop can't casually poke the edit tools.
   The only way to change what every visitor sees is to edit the
   `defaultPosts` array in this file's source and re-publish it —
   which is also, not coincidentally, the most secure way to do
   it, since it requires access to your actual files, not just a
   password typed into a browser.
============================================================ */

let posts = loadPosts();
let theme = loadTheme();
let ownerMode = false;

function loadPosts(){
  const saved = localStorage.getItem('siteDrafts');
  return saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(defaultPosts));
}
function loadTheme(){
  const saved = localStorage.getItem('themeDrafts');
  return saved ? { ...defaultTheme, ...JSON.parse(saved) } : { ...defaultTheme };
}
function saveThemeDrafts(){
  try{ localStorage.setItem('themeDrafts', JSON.stringify(theme)); } catch(e){}
}
const THEME_VAR_MAP = {
  bg:'--bg', card:'--card', cardHi:'--card-hi', rose:'--rose', lavender:'--lavender',
  sage:'--sage', gold:'--gold', ink:'--ink', inkDim:'--ink-dim', hairline:'--hairline'
};
function applyTheme(){
  const root = document.documentElement.style;
  Object.keys(THEME_VAR_MAP).forEach(key => {
    if (theme[key]) root.setProperty(THEME_VAR_MAP[key], theme[key]);
  });
}
applyTheme();

const THEME_LABELS = {
  bg:'background', card:'card background', cardHi:'card (hover)',
  rose:'rose accent (spiral, links)', lavender:'lavender accent', sage:'sage accent',
  gold:'gold (date text)', ink:'main text', inkDim:'secondary text', hairline:'borders'
};
function renderThemeGrid(){
  const grid = document.getElementById('themeGrid');
  if (!grid) return;
  grid.innerHTML = Object.keys(THEME_VAR_MAP).map(key => `
    <div class="theme-row">
      <span>${THEME_LABELS[key]}</span>
      <input type="color" value="${theme[key]}" oninput="updateThemeColor('${key}', this.value)">
    </div>`).join('');
}
function updateThemeColor(key, value){
  theme[key] = value;
  applyTheme();
  saveThemeDrafts();
}
renderThemeGrid();
document.getElementById('themeResetBtn').addEventListener('click', () => {
  theme = { ...defaultTheme };
  applyTheme();
  saveThemeDrafts();
  renderThemeGrid();
});

function saveDrafts(){
  try{
    // media that's still a raw local File (not yet uploaded to GitHub)
    // can't be persisted to localStorage — it's dropped from the saved
    // draft until it's actually published. Everything else is kept.
    const sanitized = posts.map(p => {
      const clean = { ...p, images: (p.images || []).filter(i => !i.file) };
      if (clean.audio && clean.audio.file) delete clean.audio;
      return clean;
    });
    localStorage.setItem('siteDrafts', JSON.stringify(sanitized));
  } catch(e){
    showModal(`
      <h3>storage full</h3>
      <p class="note">your browser's local storage is full. try removing something, or publish live to clear the backlog.</p>
      <div class="row"><button class="primary" onclick="hideModal()">ok</button></div>
    `);
  }
}
function mediaSrc(item){
  return item.path || item.previewUrl || item.src || '';
}
/* one shared volume level for both video and audio in the expanded
   view — persisted so it carries over between posts and browser
   sessions, not reset back to full/0.7 every time */
function getSavedVolume(){
  const v = parseFloat(localStorage.getItem('preferredVolume'));
  return isNaN(v) ? 0.7 : Math.min(1, Math.max(0, v));
}
function setSavedVolume(v){
  localStorage.setItem('preferredVolume', v);
}
function pendingMediaCount(){
  return posts.reduce((n, p) => {
    const imgCount = (p.images || []).filter(i => i.file).length;
    const audioCount = (p.audio && p.audio.file) ? 1 : 0;
    return n + imgCount + audioCount;
  }, 0);
}
function updatePendingBanner(){
  const el = document.getElementById('pendingWarning');
  if (!el) return;
  const n = pendingMediaCount();
  if (n > 0){
    el.textContent = `⚠ ${n} unpublished photo${n > 1 ? 's/videos' : '/video'} — don't refresh or close this tab until you hit "publish live", or it'll be lost.`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}
window.addEventListener('beforeunload', (e) => {
  if (pendingMediaCount() > 0){
    e.preventDefault();
    e.returnValue = '';
  }
});
function readFileAsDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function xIconSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M5 5 Q12 12 19 19" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M19 5 Q12 12 5 19" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function volIconSVG(muted, size){
  const speaker = `<path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>`;
  const waves = muted
    ? `<line x1="15" y1="9" x2="21" y2="15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
       <line x1="21" y1="9" x2="15" y2="15" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>`
    : `<path d="M16 8a5 5 0 010 8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">${speaker}${waves}</svg>`;
}
function playIconSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <path d="M9 6.5 L18 12 L9 17.5 Z" fill="currentColor"/>
  </svg>`;
}

function renderMediaTile(item, postIdx, itemIdx, expanded){
  const delBtn = `<button class="img-del x-btn" onclick="event.stopPropagation(); deleteImage(${postIdx},${itemIdx})" title="remove">${xIconSVG(12)}</button>`;
  const resolvedSrc = mediaSrc(item);
  if (item.type === 'video'){
    if (expanded){
      const startAt = item.lastTime || 0;
      return `
        <div class="img-tile video-tile expanded-video" data-post="${postIdx}" data-img="${itemIdx}">
          <video id="expandVideo-${itemIdx}" class="tile-video" src="${resolvedSrc}" playsinline
                 onloadedmetadata="this.currentTime=${startAt}; this.volume=getSavedVolume();"></video>
          <div class="audio-volume" onclick="event.stopPropagation()">
            <span class="vol-icon">${volIconSVG(false, 13)}</span>
            <input type="range" min="0" max="1" step="0.01" value="${getSavedVolume()}"
                   oninput="document.getElementById('expandVideo-${itemIdx}').volume=this.value; setSavedVolume(this.value);">
          </div>
          ${delBtn}
        </div>`;
    }
    return `
      <div class="img-tile video-tile" data-post="${postIdx}" data-img="${itemIdx}"
           onclick="handleVideoTileClick(this, ${postIdx}, ${itemIdx})">
        <video class="tile-video" src="${resolvedSrc}" muted playsinline preload="metadata"></video>
        ${delBtn}
      </div>`;
  }
  const body = resolvedSrc
    ? `<img src="${resolvedSrc}" alt="${item.label || ''}" onload="fitExpandCard()">`
    : `<div class="ph" data-label="${item.label || ''}"
         style="--c1:${item.c1 || '#8d7fa8'};--c2:${item.c2 || '#3f3a52'};--ar:${item.ar || '4/5'}"></div>`;
  return `
    <div class="img-tile" data-post="${postIdx}" data-img="${itemIdx}">
      ${body}
      ${delBtn}
    </div>`;
}

/* clicking a video tile pauses/mutes the ambient preview, resets the
   post's video to the start, and lets the click keep bubbling up to
   the card's own onclick — which opens the shared expand view, same
   as clicking anywhere else on the card */
let activeExpandTile = null;
function handleVideoTileClick(tile, postIdx, itemIdx){
  const video = tile.querySelector('video');
  const item = posts[postIdx].images[itemIdx];
  item.lastTime = 0;
  video.pause();
  video.muted = true;
  tile.classList.add('expand-source');
  activeExpandTile = tile;
}

function openExpand(pIdx){
  const post = posts[pIdx];
  const images = post.images || [];
  const cols = images.length >= 2 ? 2 : 1;
  const mediaHtml = images.map((img, iIdx) => renderMediaTile(img, pIdx, iIdx, true)).join('');
  const audioSrc = post.audio ? mediaSrc(post.audio) : '';
  document.getElementById('expandOverlay').innerHTML = `
    <div class="expand-card" style="${post.color ? `background:${post.color};` : ''}" onclick="event.stopPropagation()">
      <button class="expand-close x-btn" onclick="closeExpand()" title="close">${xIconSVG(16)}</button>
      ${images.length ? `
        <div class="grouped-images expand-images" style="grid-template-columns:repeat(${cols}, 1fr);">
          ${mediaHtml}
        </div>` : ''}
      ${(post.title || post.text) ? `
        <div class="entry-body expand-body">
          <span class="entry-date">${post.date}${post.time ? `<span class="entry-time">${post.time}</span>` : ''}</span>
          ${post.title ? `<h2 class="entry-title">${post.title}</h2>` : ''}
          ${post.text ? `<div class="entry-text">${post.text}</div>` : ''}
        </div>` : ''}
      ${audioSrc ? `
        <audio id="expandAudio" src="${audioSrc}" loop></audio>
        <div class="audio-volume" onclick="event.stopPropagation()">
          <span class="vol-icon">${volIconSVG(false, 13)}</span>
          <input type="range" min="0" max="1" step="0.01" value="${getSavedVolume()}"
                 oninput="document.getElementById('expandAudio').volume=this.value; setSavedVolume(this.value);">
        </div>` : ''}
    </div>`;
  document.getElementById('expandOverlay').classList.add('open');
  requestAnimationFrame(fitExpandCard);
  // start expanded video(s) and audio with sound right away — still
  // within the same synchronous call stack as the click, so autoplay
  // policy allows it
  document.querySelectorAll('#expandOverlay .expanded-video video').forEach(v => {
    v.muted = false;
    v.volume = getSavedVolume();
    const p = v.play();
    if (p && p.catch) p.catch(() => { v.muted = true; v.play().catch(() => {}); });
  });
  const audioEl = document.getElementById('expandAudio');
  if (audioEl){
    audioEl.volume = getSavedVolume();
    const p = audioEl.play();
    if (p && p.catch) p.catch(() => {});
  }
}
function closeExpand(){
  document.getElementById('expandOverlay').classList.remove('open');
  document.querySelectorAll('#expandOverlay video').forEach(v => v.pause());
  const audioEl = document.getElementById('expandAudio');
  if (audioEl) audioEl.pause();
  if (activeExpandTile){
    activeExpandTile.classList.remove('expand-source');
    activeExpandTile = null;
  }
}

/* media is capped via CSS (max-height + object-fit:contain), so no
   JS scaling is needed here anymore — this used to shrink the whole
   card including the text, which wasn't right. Kept as a no-op so
   the onload="fitExpandCard()" hooks on images don't error out. */
function fitExpandCard(){}
window.addEventListener('resize', fitExpandCard);

function render(){
  const feed = document.getElementById('feed');
  let html = '';
  let delay = 0;
  posts.forEach((post, pIdx) => {
    const images = post.images || [];
    const hasImages = images.length > 0;
    const cols = images.length >= 2 ? 2 : 1;
    const showTitle = ownerMode || post.title;
    const showText = ownerMode || post.text;
    html += `
      <article class="card ${hasImages ? 'grouped' : 'text'}"
               style="animation-delay:${delay}s;${post.color ? `background:${post.color};` : ''}"
               ${ownerMode ? '' : `onclick="openExpand(${pIdx})"`}>
        ${hasImages ? `
          <div class="grouped-images" style="grid-template-columns:repeat(${cols}, 1fr);">
            ${images.map((img, iIdx) => renderMediaTile(img, pIdx, iIdx)).join('')}
          </div>` : ''}
        ${(showTitle || showText || !hasImages) ? `
        <div class="entry-body">
          <span class="entry-date">${post.date}${post.time ? `<span class="entry-time">${post.time}</span>` : ''}</span>
          ${showTitle ? `<h2 class="entry-title" contenteditable="${ownerMode}" data-placeholder="title..."
              onblur="updateField(${pIdx},'title',this.innerText)">${post.title || ''}</h2>` : ''}
          ${showText ? `<div class="entry-text" contenteditable="${ownerMode}" data-placeholder="text..."
             onkeydown="handleEditableKeydown(event)"
             onblur="updateField(${pIdx},'text',this.innerText)">${post.text || ''}</div>` : ''}
          <div class="card-controls">
            <button onclick="addImageToPost(${pIdx})">+ media</button>
            <button onclick="addAudioToPost(${pIdx})">${post.audio ? 'change audio' : '+ audio'}</button>
            ${post.audio ? `<button onclick="removeAudioFromPost(${pIdx})">remove audio</button>` : ''}
            <button onclick="editEntryColor(${pIdx})">color</button>
            <button onclick="deleteEntry(${pIdx})">delete entry</button>
          </div>
        </div>` : ''}
      </article>`;
    delay += 0.05;
  });
  feed.innerHTML = html;
  updatePendingBanner();
  kickstartPreviewVideos(feed);
}
function kickstartPreviewVideos(scope){
  scope.querySelectorAll('.video-tile:not(.expand-source):not(.expanded-video) video').forEach(v => briefPlay(v));
}
/* nudges a paused, muted preview video to actually paint a frame —
   playing (even briefly) reliably renders in every browser, unlike
   seeking a fully-paused element, which some browsers leave blank.
   Never touches .expand-source (the mini tile behind an open expand
   view) or .expanded-video (the actual enlarged, playing video) —
   those are excluded so this never interrupts something you clicked
   into and are actually watching. */
function briefPlay(v){
  v.muted = true;
  const tile = v.closest('.video-tile');
  const p = v.play();
  if (p && p.then){
    p.then(() => {
      setTimeout(() => {
        if (tile && !tile.classList.contains('expand-source') && !tile.classList.contains('expanded-video')) v.pause();
      }, 260);
    }).catch(() => {});
  }
}
/* slideshow effect: every 2s, jump each idle preview forward and hold
   that still frame — reads as a handful of stills rather than a
   smoothly playing video, with no sound either way */
setInterval(() => {
  document.querySelectorAll('.video-tile:not(.expand-source):not(.expanded-video) video').forEach(v => {
    if (!v.duration || isNaN(v.duration)) return;
    let t = (v.currentTime || 0) + 4;
    if (t >= v.duration) t = 0;
    v.currentTime = t;
    briefPlay(v);
  });
}, 2000);
render();

function updateField(pIdx, field, value){
  posts[pIdx][field] = value;
  saveDrafts();
}
/* contenteditable elements handle Enter inconsistently (and a <p> can't
   contain the line-break markup some browsers try to insert at all) —
   this makes both Enter and Shift+Enter reliably insert a simple line
   break instead of doing nothing or splitting into a new block. */
function handleEditableKeydown(e){
  if (e.key === 'Enter'){
    e.preventDefault();
    document.execCommand('insertLineBreak');
  }
}
function editEntryColor(pIdx){

function addImageToPost(pIdx){

/* ---------- publish straight to GitHub Pages ---------- */
function utf8ToB64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64ToUtf8(str){
  return decodeURIComponent(escape(atob(str)));
}

function saveGhConfig(cfg) {
    localStorage.setItem('ghConfig', JSON.stringify(cfg));
}

function getGhConfig() {
    const raw = localStorage.getItem('ghConfig');
    if (!raw) return null;

    const cfg = JSON.parse(raw);

    // Repair old relay URLs that don't include https://
    if (cfg.relayUrl && !/^https?:\/\//i.test(cfg.relayUrl)) {
        cfg.relayUrl = 'https://' + cfg.relayUrl;
        localStorage.setItem('ghConfig', JSON.stringify(cfg));
    }

    return cfg;
}

function openGhSettings() {
    const cfg = getGhConfig() || {
        owner: '',
        repo: '',
        path: 'index.html',
        branch: 'main',
        relayUrl: ''
    };

    showModal(`
        <h3>github settings</h3>
        <p class="note">your username, the repo name, the file path (usually index.html), and the auth relay URL from your Cloudflare Worker setup.</p>

        <input type="text" id="ghOwner" placeholder="github username" value="${cfg.owner}">
        <input type="text" id="ghRepo" placeholder="repo name" value="${cfg.repo}">
        <input type="text" id="ghPath" placeholder="file path" value="${cfg.path}">
        <input type="text" id="ghBranch" placeholder="branch" value="${cfg.branch}">
        <input type="text" id="ghRelay" placeholder="auth relay URL (https://...workers.dev)" value="${cfg.relayUrl || ''}">

        <div class="err" id="ghErr"></div>

        <div class="row">
            <button onclick="hideModal()">cancel</button>
            <button class="primary" id="ghSaveYes">save</button>
        </div>
    `);

    document.getElementById('ghSaveYes').onclick = () => {
        const owner = document.getElementById('ghOwner').value.trim();
        const repo = document.getElementById('ghRepo').value.trim();
        const path = document.getElementById('ghPath').value.trim() || 'index.html';
        const branch = document.getElementById('ghBranch').value.trim() || 'main';

        let relayUrl = document.getElementById('ghRelay').value.trim().replace(/\/$/, '');

        if (!/^https?:\/\//i.test(relayUrl)) {
            relayUrl = 'https://' + relayUrl;
        }

        if (!owner || !repo || !relayUrl) {
            document.getElementById('ghErr').textContent =
                'username, repo, and relay URL are required.';
            return;
        }

        saveGhConfig({ owner, repo, path, branch, relayUrl });
        hideModal();
    };
}

document.getElementById('ghSettingsBtn').addEventListener('click', openGhSettings);

function ghToken(){
  return localStorage.getItem('ghUserToken') || '';
}
async function refreshGhToken(cfg){
  const refreshToken = localStorage.getItem('ghRefreshToken');
  if (!refreshToken || !cfg || !cfg.relayUrl) return false;
  try{
    const res = await fetch(`${cfg.relayUrl}/access_token`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        client_id: GH_CLIENT_ID,
        grant_type: 'refresh_token',
        refresh_token: refreshToken
      })
    });
    const data = await res.json();
    if (data.access_token){
      localStorage.setItem('ghUserToken', data.access_token);
      if (data.refresh_token) localStorage.setItem('ghRefreshToken', data.refresh_token);
      return true;
    }
  } catch(e){}
  return false;
}
/* wraps a GitHub API call, retrying once with a refreshed token if the
   current one turns out to be expired (a 401) */
async function githubFetch(url, options, cfg){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { 'Authorization': `Bearer ${ghToken()}` });
  let res = await fetch(url, options);
  if (res.status === 401){
    const refreshed = await refreshGhToken(cfg);
    if (refreshed){
      options.headers['Authorization'] = `Bearer ${ghToken()}`;
      res = await fetch(url, options);
    }
  }
  return res;
}

async function uploadMediaFile(file, cfg){
  const dataUrl = await readFileAsDataURL(file);
  const base64 = dataUrl.split(',')[1];
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_') || 'file';
  const path = `media/${Date.now()}-${safeName}`;
  const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`;
  const res = await githubFetch(apiUrl, {
    method:'PUT',
    headers:{
      'Accept':'application/vnd.github+json',
      'Content-Type':'application/json'
    },
    body: JSON.stringify({
      message: `upload media: ${safeName}`,
      content: base64,
      branch: cfg.branch
    })
  }, cfg);
  if (!res.ok){
    const err = await res.json().catch(() => ({}));
    throw new Error(err.message || `media upload failed (${res.status}) for ${file.name}`);
  }
  return path;
}

async function publishLive(){
  const cfg = getGhConfig();
  if (!cfg){ openGhSettings(); return; }
  if (!ghToken()){ startGithubLogin(); return; }
  const btn = document.getElementById('publishLiveBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  try{
    // upload any media that's still a raw local file, one at a time,
    // and swap it for the real path GitHub gives back
    const pending = [];
    posts.forEach(p => {
      (p.images || []).forEach(item => { if (item.file) pending.push(item); });
      if (p.audio && p.audio.file) pending.push(p.audio);
    });
    for (let i = 0; i < pending.length; i++){
      btn.textContent = `uploading media ${i + 1}/${pending.length}…`;
      const item = pending[i];
      const path = await uploadMediaFile(item.file, cfg);
      item.path = path;
      delete item.file;
      delete item.previewUrl;
    }
    saveDrafts();

    btn.textContent = 'publishing…';
    const apiUrl = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}?ref=${cfg.branch}`;
    const getRes = await githubFetch(apiUrl, {
      headers:{ 'Accept':'application/vnd.github+json' }
    }, cfg);
    if (!getRes.ok) throw new Error(`couldn't read the file (${getRes.status}). check the repo/path in settings, and that you're signed in.`);
    const getData = await getRes.json();

    // GitHub only inlines base64 content for files under ~1MB. This file
    // is much bigger once photos/videos are embedded, so it hands back a
    // download_url instead — fetch the raw file directly in that case.
    let currentText;
    if (getData.content){
      currentText = b64ToUtf8(getData.content);
    } else if (getData.download_url){
      const rawRes = await fetch(getData.download_url);
      if (!rawRes.ok) throw new Error(`couldn't download the current live file (${rawRes.status}).`);
      currentText = await rawRes.text();
    } else {
      throw new Error('GitHub did not return the file content or a download link.');
    }

    function patchBlock(text, startMarker, endMarker, newInner){
      const startIdx = text.indexOf(startMarker);
      const endIdx = text.indexOf(endMarker);
      if (startIdx === -1 || endIdx === -1){
        throw new Error(`could not find the ${startMarker} markers in the live file — make sure the uploaded file matches this one.`);
      }
      const newBlock = `${startMarker}\n${newInner}\n${endMarker}`;
      return text.slice(0, startIdx) + newBlock + text.slice(endIdx + endMarker.length);
    }

    let newText = patchBlock(
      currentText,
      '/* DEFAULT_POSTS_START */',
      '/* DEFAULT_POSTS_END */',
      `const defaultPosts = ${JSON.stringify(posts, null, 2)};`
    );
    newText = patchBlock(
      newText,
      '/* DEFAULT_THEME_START */',
      '/* DEFAULT_THEME_END */',
      `const defaultTheme = ${JSON.stringify(theme, null, 2)};`
    );

    const putRes = await githubFetch(apiUrl, {
      method:'PUT',
      headers:{
        'Accept':'application/vnd.github+json',
        'Content-Type':'application/json'
      },
      body: JSON.stringify({
        message: `update posts — ${new Date().toISOString()}`,
        content: utf8ToB64(newText),
        sha: getData.sha,
        branch: cfg.branch
      })
    }, cfg);
    if (!putRes.ok){
      const errBody = await putRes.json().catch(() => ({}));
      throw new Error(errBody.message || `push failed (${putRes.status}).`);
    }
    render();
    showModal(`
      <h3>published</h3>
      <p class="note">pushed to ${cfg.owner}/${cfg.repo}. GitHub Pages usually updates within a minute or two.</p>
      <div class="row"><button class="primary" onclick="hideModal()">ok</button></div>
    `);
  } catch(err){
    showModal(`
      <h3>publish failed</h3>
      <p class="note">${(err.message || 'something went wrong').replace(/</g,'&lt;')}</p>
      <div class="row"><button class="primary" onclick="hideModal()">ok</button></div>
    `);
  } finally {
    btn.textContent = originalLabel;
    btn.disabled = false;
  }
}
document.getElementById('publishLiveBtn').addEventListener('click', publishLive);

document.getElementById('resetBtn').addEventListener('click', () => {
  showModal(`
    <h3>reset local drafts?</h3>
    <p class="note">this reverts to the published version in this file and can't be undone.</p>
    <div class="row">
      <button onclick="hideModal()">cancel</button>
      <button class="primary" id="resetYes">reset</button>
    </div>
  `);
  document.getElementById('resetYes').onclick = () => {
    hideModal();
    localStorage.removeItem('siteDrafts');
    posts = JSON.parse(JSON.stringify(defaultPosts));
    render();
  };
});

/* ---------- real GitHub login (replaces the old passcode gate) ----------
   Device flow: GitHub shows the person a code, they approve it on
   github.com itself, and only THEN does this page get a real token —
   there's no local flag or hash for anyone to fake from dev tools. The
   Cloudflare Worker (relayUrl) exists purely to get around GitHub
   blocking browsers from calling its OAuth endpoints directly; it holds
   no secrets of its own. */
const GH_CLIENT_ID = 'Iv23licjm9G9tcqr6PUW';

function showModal(inner){
  document.getElementById('modalBox').innerHTML = inner;
  document.getElementById('modalOverlay').style.display = 'flex';
}
function hideModal(){
  document.getElementById('modalOverlay').style.display = 'none';
}

let loginPollTimer = null;
async function startGithubLogin(){
  const cfg = getGhConfig();
  if (!cfg || !cfg.relayUrl){
    showModal(`
      <h3>one more thing</h3>
      <p class="note">set the "auth relay URL" in github settings first — that's the Cloudflare Worker address from setup.</p>
      <div class="row"><button class="primary" onclick="hideModal(); openGhSettings();">go to settings</button></div>
    `);
    return;
  }
  try{
    const codeRes = await fetch(`${cfg.relayUrl}/device/code`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ client_id: GH_CLIENT_ID })
    });
    const codeData = await codeRes.json();
    if (!codeData.device_code) throw new Error(codeData.error_description || 'could not start login.');

    showModal(`
      <h3>sign in with github</h3>
      <p class="note">go to <a href="${codeData.verification_uri}" target="_blank" rel="noopener" style="color:var(--sage);">${codeData.verification_uri}</a> and enter this code:</p>
      <div style="font-family:'Space Mono',monospace;font-size:22px;letter-spacing:0.12em;text-align:center;padding:14px;border:1px solid var(--hairline);border-radius:4px;margin-bottom:12px;color:var(--gold);">${codeData.user_code}</div>
      <p class="note" id="loginStatus">waiting for you to approve…</p>
      <div class="row"><button onclick="hideModal(); clearTimeout(loginPollTimer);">cancel</button></div>
    `);
    pollForToken(cfg.relayUrl, codeData.device_code, codeData.interval || 5);
  } catch(err){
    showModal(`<h3>login failed</h3><p class="note">${(err.message || 'something went wrong').replace(/</g,'&lt;')}</p><div class="row"><button class="primary" onclick="hideModal()">ok</button></div>`);
  }
}

function pollForToken(relayUrl, deviceCode, interval){
  clearTimeout(loginPollTimer);
  loginPollTimer = setTimeout(async () => {
    try{
      const res = await fetch(`${relayUrl}/access_token`, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({
          client_id: GH_CLIENT_ID,
          device_code: deviceCode,
          grant_type: 'urn:ietf:params:oauth:grant-type:device_code'
        })
      });
      const data = await res.json();
      const statusEl = document.getElementById('loginStatus');
      if (data.access_token){
        await finishGithubLogin(data);
      } else if (data.error === 'authorization_pending'){
        pollForToken(relayUrl, deviceCode, interval);
      } else if (data.error === 'slow_down'){
        pollForToken(relayUrl, deviceCode, data.interval || interval + 5);
      } else if (data.error === 'expired_token'){
        if (statusEl) statusEl.textContent = 'code expired — close this and try again.';
      } else if (data.error === 'access_denied'){
        if (statusEl) statusEl.textContent = 'login was denied.';
      } else {
        pollForToken(relayUrl, deviceCode, interval);
      }
    } catch(err){
      pollForToken(relayUrl, deviceCode, interval);
    }
  }, interval * 1000);
}

async function finishGithubLogin(tokenData){
  localStorage.setItem('ghUserToken', tokenData.access_token);
  if (tokenData.refresh_token) localStorage.setItem('ghRefreshToken', tokenData.refresh_token);
  const cfg = getGhConfig();
  try{
    const res = await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}`, {
      headers:{ 'Authorization': `Bearer ${tokenData.access_token}`, 'Accept':'application/vnd.github+json' }
    });
    const data = await res.json();
    if (!data.permissions || !data.permissions.push){
      localStorage.removeItem('ghUserToken');
      localStorage.removeItem('ghRefreshToken');
      showModal(`
        <h3>not authorized</h3>
        <p class="note">signed in fine, but that github account doesn't have write access to ${cfg.owner}/${cfg.repo}, so it can't be the owner account for this site.</p>
        <div class="row"><button class="primary" onclick="hideModal()">ok</button></div>
      `);
      return;
    }
  } catch(e){ /* network hiccup — proceed, later API calls will fail loudly if something's really wrong */ }
  hideModal();
  unlock();
}

/* One-time recovery — deliberately NOT a public button. If a token gets
   stuck/broken, open the browser console (F12) and type
   forceGithubSignOut(), then sign in again normally. */
function forceGithubSignOut(){
  localStorage.removeItem('ghUserToken');
  localStorage.removeItem('ghRefreshToken');
  lock();
  return 'signed out — click the lock icon to sign in again.';
}

function unlock(){
  ownerMode = true;
  document.body.classList.add('owner-mode');
  document.getElementById('ownerToggle').classList.add('unlocked');
  document.getElementById('editPanel').classList.add('open');
  render();
}
function lock(){
  ownerMode = false;
  document.body.classList.remove('owner-mode');
  document.getElementById('ownerToggle').classList.remove('unlocked');
  document.getElementById('editPanel').classList.remove('open');
  render();
}
function togglePanel(){
  document.getElementById('editPanel').classList.toggle('open');
}

document.getElementById('ownerToggle').addEventListener('click', () => {
  if (ownerMode){ togglePanel(); return; }
  if (localStorage.getItem('ghUserToken')) unlock();
  else startGithubLogin();
});
document.getElementById('panelArrow').addEventListener('click', () => {
  document.getElementById('editPanel').classList.remove('open');
});
document.getElementById('lockBtn').addEventListener('click', () => lock());

function buildSpiral(){
  const cx = 50, cy = 50;
  const turns = 2.6;
  const maxR = 40;
  const minR = 2;
  const steps = 140;
  let d = '';
  for (let i = 0; i <= steps; i++){
    const t = i / steps;
    const angle = t * turns * Math.PI * 2;
    const r = minR + (maxR - minR) * t;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);
    d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2) + ' ';
  }
  document.getElementById('spiralPath').setAttribute('d', d.trim());
}
buildSpiral();

document.getElementById('homeBtn').addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeExpand();
});
